lint:
  - packages/**
  - package.json
  - package-lock.json
  - .github/workflows/ci.yml
  - .github/changed-files.yml

agent_marketplace:
  - packages/agent-marketplace/**

demo_relay:
  - packages/uikit-preview/demo-relay/**
  - packages/mcp-relay/**
  - package.json
  - package-lock.json
  - .github/workflows/ci.yml
