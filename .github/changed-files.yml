lint:
  - packages/**
  - package.json
  - package-lock.json
  - .github/workflows/ci.yml
  - .github/changed-files.yml

agent_marketplace:
  - packages/agent-marketplace/**

demo_relay:
  - packages/uikit-preview/demo-relay/**
  - packages/mcp-relay/**
  - package.json
  - package-lock.json
  - .github/workflows/ci.yml
  - .github/workflows/deploy-relay.yml
  - .github/changed-files.yml

# Packages with vitest specs that the `demo_relay` group does not already cover.
# `npm test` runs every workspace's suite, so a change confined to one of these
# still has to trigger the test job.
vitest:
  - packages/http-client-core/**
  - packages/http-client-react/**
  - packages/http-client-msw/**

# Only the committed snapshot PNGs. On pull requests the visual-snapshots job
# checks exactly the stories whose PNGs changed here; the merge-queue run is
# unconditional and re-checks the full suite (see ci.yml).
visual_snapshot_files:
  - packages/uikit-preview/tests/snapshot.spec.ts-snapshots/**
