name: ci

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  merge_group:

permissions:
  actions: read
  contents: read

jobs:
  detect-changes:
    # Skipped on merge_group so queue runs execute every suite unconditionally.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.changed-files.outputs.lint_any_changed }}
      agent_marketplace: ${{ steps.changed-files.outputs.agent_marketplace_any_changed }}
      snapshot_files: ${{ steps.changed-files.outputs.visual_snapshot_files_all_changed_files }}
      demo_relay: ${{ steps.changed-files.outputs.demo_relay_any_changed }}
      vitest: ${{ steps.changed-files.outputs.vitest_any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files_yaml_from_source_file: .github/changed-files.yml

  lint:
    needs: detect-changes
    if: |
      !cancelled() &&
      (github.event_name == 'merge_group' || needs.detect-changes.outputs.lint == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Enable Corepack
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type:check

      # uikit-preview is this repo's own Panda consumer, and the type check above
      # runs its `panda codegen`/`cssgen` — so a real generated stylesheet exists
      # by this point. Scanning it here gates doctor's silent-CSS checks against
      # real output: unwired `staticCss`, unresolved token paths, and roleless
      # `colorPalette` values all fail the job instead of shipping quietly.
      - name: Doctor the preview stylesheet
        run: node packages/uikit-cli/dist/cli.js doctor packages/uikit-preview/styled-system/styles.css

  check-agent-marketplace:
    needs: detect-changes
    if: |
      !cancelled() &&
      (github.event_name == 'merge_group' || needs.detect-changes.outputs.agent_marketplace == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Enable Corepack
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci

      - name: Verify agent-marketplace generated artifacts are committed
        run: npm run check --workspace @archon-research/agent-marketplace

  test:
    needs: detect-changes
    if: |
      !cancelled() &&
      (github.event_name == 'merge_group' ||
       needs.detect-changes.outputs.demo_relay == 'true' ||
       needs.detect-changes.outputs.vitest == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Enable Corepack
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci

      - name: Build the relay core
        run: npm run build --workspace packages/mcp-relay

      # http-client-react's specs import @archon-research/http-client-core, whose
      # exports resolve to dist/, so the dependency must be built before vitest runs.
      - name: Build http-client-core
        run: npm run build --workspace packages/http-client-core

      # dashboard-kit's charting-interaction.test.ts imports @archon-research/charting,
      # whose exports also resolve to dist/, so it needs the same treatment.
      - name: Build charting
        run: npm run build --workspace packages/charting

      - name: Run all vitest specs (relay core unit + Worker/DO integration)
        run: npm test

  visual-snapshots:
    needs:
      - detect-changes
      - lint
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      (github.event_name == 'merge_group' || needs.detect-changes.outputs.snapshot_files != '')
    # Pinned to macos-26 (not macos-latest) so the runner matches the macOS
    # version snapshots are generated on. CoreText font metrics differ between
    # macOS major versions, so a mismatch reflows text and fails comparisons.
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Enable Corepack
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci

      # Fail fast (before the build/render) if any committed snapshot PNG has no
      # matching story — left behind when a story was removed or renamed.
      - name: Check for orphaned snapshots
        run: npm run snapshot:check-orphans --workspace @archon-research/uikit-preview

      - name: Build packages
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium

      # Pull requests only re-render the stories whose PNGs changed (derived from
      # the snapshot filenames "<story-id>-chromium-darwin.png"). SNAPSHOT_STORY_IDS
      # is consumed by tests/snapshot.spec.ts. The merge_group run skips this step,
      # leaving the env unset so the full suite runs as the merge gate.
      - name: Scope snapshots to changed PNGs (pull requests only)
        if: github.event_name != 'merge_group'
        env:
          CHANGED_SNAPSHOTS: ${{ needs.detect-changes.outputs.snapshot_files }}
        run: |
          ids=""
          for f in $CHANGED_SNAPSHOTS; do
            case "$f" in
              *-chromium-darwin.png)
                base="$(basename "$f")"
                ids="${ids:+$ids,}${base%-chromium-darwin.png}"
                ;;
            esac
          done
          echo "SNAPSHOT_STORY_IDS=$ids" >> "$GITHUB_ENV"
          echo "Scoped visual snapshots to: ${ids:-<none>}"

      - name: Run Ladle visual snapshots
        run: npm run snapshot:test --workspace @archon-research/uikit-preview

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladle-playwright-report
          path: packages/uikit-preview/playwright-report
          if-no-files-found: ignore

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladle-snapshot-diffs
          path: |
            packages/uikit-preview/test-results
            packages/uikit-preview/tests/snapshot.spec.ts-snapshots
          if-no-files-found: ignore

  success:
    needs:
      - detect-changes
      - lint
      - check-agent-marketplace
      - test
      - visual-snapshots
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ github.event_name }}" != "merge_group" && "${{ needs.detect-changes.result }}" != "success" ]]; then
            echo "detect-changes did not succeed (result: '${{ needs.detect-changes.result }}')"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs were cancelled"
            exit 1
          fi
          echo 'All required CI checks passed or were skipped.'
