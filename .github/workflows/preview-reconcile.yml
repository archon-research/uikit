name: preview-reconcile

# Safety net for gh-pages/pr/<N> preview folders: if a PR's `cleanup` run
# (see preview.yml) never happened or exhausted its retries, this sweeps any
# folder whose PR is no longer open. Runs on a schedule since there's no
# event that reliably fires once a folder goes stale, plus workflow_dispatch
# for on-demand runs (e.g. to clear an existing backlog).
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Remove preview folders for closed PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/reconcile-pr-previews.sh
