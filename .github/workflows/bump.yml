name: bump

on:
  workflow_dispatch:
    inputs:
      publish_all:
        description: >-
          Publish every workspace package, even from a prerelease branch.
          Releases from the default branch always publish everything.
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  packages: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Resolve affected packages
        id: affected
        # Prereleases publish only what the branch touched; releases from the
        # default branch always publish a coherent full set.
        if: ${{ github.ref_name != github.event.repository.default_branch && !inputs.publish_all }}
        run: node .github/scripts/affected-packages.ts

      - name: Enable Corepack
        run: |
          corepack enable npm
          echo "npm on PATH: $(command -v npm) ($(npm --version))"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec semantic-release

      - name: Trigger publish workflow
        if: steps.release.outputs.release_version != '' && steps.affected.outputs.skip_publish != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_REF: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          # Empty when the affected step was skipped or fell back to the full
          # set, which publish.yml reads as "publish everything".
          AFFECTED_PACKAGES: ${{ steps.affected.outputs.packages }}
        run: |
          gh workflow run publish.yml --ref "$WORKFLOW_REF" \
            -f release_tag="release-$RELEASE_VERSION" \
            -f packages="$AFFECTED_PACKAGES"

      - name: Nothing to publish
        if: steps.release.outputs.release_version != '' && steps.affected.outputs.skip_publish == 'true'
        run: echo "Every package this branch affects is private; publish workflow not triggered."

      - name: No release generated
        if: steps.release.outputs.release_version == ''
        run: echo "semantic-release did not create a new version; publish workflow not triggered."
